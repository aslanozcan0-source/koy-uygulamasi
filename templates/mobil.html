<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Köyümüz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Köyümüz">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6b4f">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/favicon.png">
<link rel="manifest" href="/static/manifest.json">
<style>
  :root {
    --bg: #f4f6f3;
    --card: #ffffff;
    --primary: #2f6b4f;
    --primary-dark: #234f3a;
    --accent: #d98e3b;
    --text: #23291f;
    --muted: #6b7268;
    --border: #e4e8e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .phone {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 28px 20px 20px;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
  }
  header p {
    margin: 0;
    opacity: 0.85;
    font-size: 13px;
  }
  .tabs {
    display: flex;
    margin: -18px 16px 0;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    overflow: hidden;
    z-index: 2;
    position: relative;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 13px 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border: none;
    background: transparent;
  }
  .tab.active {
    color: white;
    background: var(--primary);
  }
  main {
    padding: 24px 16px 40px;
    flex: 1;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card.onemli {
    border-left: 4px solid var(--accent);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card h3 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 700;
  }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    background: #fbeedd;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .card p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.5;
  }
  .meta {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 12px;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 40px 10px;
  }
  .loading {
    text-align: center;
    color: var(--muted);
    padding: 30px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>🏡 Köyümüz</h1>
    <p>Duyurular ve etkinlikler tek bir yerde</p>
  </header>
  <div class="tabs">
    <button class="tab active" id="tab-duyuru" onclick="sekmeDegistir('duyuru')">Duyurular</button>
    <button class="tab" id="tab-etkinlik" onclick="sekmeDegistir('etkinlik')">Etkinlikler</button>
  </div>
  <main>
    <div id="icerik" class="loading">Yükleniyor...</div>
  </main>
</div>

<script>
let aktifSekme = 'duyuru';

function sekmeDegistir(sekme) {
  aktifSekme = sekme;
  document.getElementById('tab-duyuru').classList.toggle('active', sekme === 'duyuru');
  document.getElementById('tab-etkinlik').classList.toggle('active', sekme === 'etkinlik');
  yukle();
}

function tarihFormatla(tarih) {
  try {
    const d = new Date(tarih);
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) {
    return tarih;
  }
}

async function yukle() {
  const icerik = document.getElementById('icerik');
  icerik.innerHTML = '<div class="loading">Yükleniyor...</div>';
  try {
    if (aktifSekme === 'duyuru') {
      const res = await fetch('/api/duyurular');
      const veriler = await res.json();
      if (veriler.length === 0) {
        icerik.innerHTML = '<div class="empty">Henüz duyuru yok.</div>';
        return;
      }
      icerik.innerHTML = veriler.map(d => `
        <div class="card ${d.onemli ? 'onemli' : ''}">
          <div class="card-top">
            <h3>${escapeHtml(d.baslik)}</h3>
            ${d.onemli ? '<span class="badge">ÖNEMLİ</span>' : ''}
          </div>
          <p>${escapeHtml(d.icerik)}</p>
          <div class="meta"><span>📅 ${tarihFormatla(d.tarih)}</span></div>
        </div>
      `).join('');
    } else {
      const res = await fetch('/api/etkinlikler');
      const veriler = await res.json();
      if (veriler.length === 0) {
        icerik.innerHTML = '<div class="empty">Henüz etkinlik yok.</div>';
        return;
      }
      icerik.innerHTML = veriler.map(e => `
        <div class="card">
          <div class="card-top">
            <h3>${escapeHtml(e.baslik)}</h3>
          </div>
          <p>${escapeHtml(e.aciklama)}</p>
          <div class="meta">
            <span>📅 ${tarihFormatla(e.tarih)}</span>
            ${e.yer ? `<span>📍 ${escapeHtml(e.yer)}</span>` : ''}
          </div>
        </div>
      `).join('');
    }
  } catch (err) {
    icerik.innerHTML = '<div class="empty">Yüklenirken bir hata oluştu.</div>';
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

yukle();
</script>
</body>
</html>
